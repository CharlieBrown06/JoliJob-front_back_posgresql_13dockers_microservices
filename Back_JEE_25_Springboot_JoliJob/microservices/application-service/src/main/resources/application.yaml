spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applications}
    username: ${DB_USERNAME:jolijob}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/jolijob}
          jwk-set-uri: ${JWT_JWK_SET_URI:${JWT_ISSUER_URI:http://localhost:8081/realms/jolijob}/protocol/openid-connect/certs}
          audience: ${JWT_AUDIENCE:jolijob-api}

server:
  port: 8085

services:
  profiles:
    base-url: ${PROFILE_SERVICE_URL:http://localhost:8083}
  job-offers:
    base-url: ${JOB_OFFER_SERVICE_URL:http://localhost:8084}
