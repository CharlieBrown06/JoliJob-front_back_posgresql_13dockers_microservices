<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc">
  <title id="title">Architecture microservices de JoliJob</title>
  <desc id="desc">Diagramme coloré montrant le client, Keycloak, la gateway, les services métier, PostgreSQL, Kafka, Elasticsearch et SMTP.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}
      .title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#64748b}
      .card{stroke-width:2;rx:16}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}
      .tiny{font-size:12px;fill:#475569}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .pill{font-size:12px;font-weight:650}
    </style>
  </defs>

  <rect width="1500" height="1030" fill="#f8fafc"/>
  <text class="title" x="56" y="52">JoliJob · Architecture microservices</text>
  <text class="subtitle" x="58" y="78">Flux applicatifs actuels · les flèches décrivent les échanges et non une topologie de déploiement</text>

  <!-- Client and identity -->
  <rect class="card" x="60" y="110" width="230" height="100" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="84" y="151">Navigateur</text>
  <text class="small" x="84" y="177">Client web JoliJob</text>

  <rect class="card" x="465" y="110" width="310" height="100" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="label" x="490" y="149">Keycloak</text>
  <text class="small" x="490" y="174">OIDC · realm jolijob · :8081</text>
  <text class="tiny" x="490" y="194">Émet les JWT et expose les clés JWKS</text>

  <rect class="card" x="1090" y="110" width="310" height="100" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="label" x="1115" y="149">API Gateway · :8080</text>
  <text class="small" x="1115" y="176">Routage REST · transmet le Bearer token</text>

  <path class="line" d="M290 150H455" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <rect x="315" y="123" width="118" height="24" rx="12" fill="#ede9fe"/>
  <text class="pill" x="329" y="140" fill="#6d28d9">OIDC + PKCE</text>

  <path class="line" d="M290 187C560 260 900 260 1080 185" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="710" y="226" width="160" height="25" rx="12" fill="#dbeafe"/>
  <text class="pill" x="728" y="243" fill="#1d4ed8">API · Bearer token</text>

  <!-- Gateway routes -->
  <path class="line" d="M1245 210V270H197M1245 270H1172" stroke="#2563eb" opacity=".85"/>
  <path class="line" d="M197 270V310M522 270V310M847 270V310M1172 270V310" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text class="tiny" x="628" y="263">Routage vers les quatre API métier</text>

  <!-- Business services -->
  <rect class="card" x="60" y="315" width="275" height="120" fill="#ecfdf5" stroke="#34d399"/>
  <text class="label" x="82" y="352">Profile service</text>
  <text class="small" x="82" y="378">Profils candidats et entreprises</text>
  <text class="tiny" x="82" y="408">:8083</text>

  <rect class="card" x="385" y="315" width="275" height="120" fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="407" y="352">Job offer service</text>
  <text class="small" x="407" y="378">Publication et gestion des offres</text>
  <text class="tiny" x="407" y="408">:8084</text>

  <rect class="card" x="710" y="315" width="275" height="120" fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="732" y="352">Application service</text>
  <text class="small" x="732" y="378">Dépôt et suivi des candidatures</text>
  <text class="tiny" x="732" y="408">:8085</text>

  <rect class="card" x="1035" y="315" width="275" height="120" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="label" x="1057" y="352">Search service</text>
  <text class="small" x="1057" y="378">API de recherche des offres</text>
  <text class="tiny" x="1057" y="408">:8086</text>

  <!-- Inter-service HTTP -->
  <path class="line" d="M385 392H345" stroke="#0891b2" marker-end="url(#arrow-cyan)"/>
  <path class="line" d="M710 374C620 288 390 288 250 306" stroke="#0891b2" marker-end="url(#arrow-cyan)"/>
  <path class="line" d="M710 410H670" stroke="#0891b2" marker-end="url(#arrow-cyan)"/>
  <rect x="331" y="438" width="76" height="23" rx="11" fill="#cffafe"/>
  <text class="pill" x="348" y="454" fill="#0e7490">HTTP</text>
  <rect x="521" y="293" width="76" height="23" rx="11" fill="#cffafe"/>
  <text class="pill" x="538" y="309" fill="#0e7490">HTTP</text>
  <rect x="668" y="438" width="76" height="23" rx="11" fill="#cffafe"/>
  <text class="pill" x="685" y="454" fill="#0e7490">HTTP</text>

  <!-- Authentication note -->
  <rect x="60" y="470" width="1250" height="40" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text class="small" x="82" y="496">Sécurité : les services protégés valident indépendamment la signature JWT, l’émetteur et l’audience à l’aide des clés publiques JWKS de Keycloak.</text>

  <!-- Databases -->
  <rect class="card" x="60" y="545" width="275" height="90" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="82" y="581">PostgreSQL</text>
  <text class="small" x="82" y="608">Base profiles</text>
  <path class="line" d="M197 435V535" stroke="#64748b"/>
  <path class="line" d="M197 535V545" stroke="#64748b" marker-end="url(#arrow-blue)"/>

  <rect class="card" x="385" y="545" width="275" height="90" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="407" y="581">PostgreSQL</text>
  <text class="small" x="407" y="608">Base joboffers + outbox</text>
  <path class="line" d="M522 435V545" stroke="#64748b" marker-end="url(#arrow-blue)"/>

  <rect class="card" x="710" y="545" width="275" height="90" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="732" y="581">PostgreSQL</text>
  <text class="small" x="732" y="608">Base applications + outbox</text>
  <path class="line" d="M847 435V545" stroke="#64748b" marker-end="url(#arrow-blue)"/>

  <rect class="card" x="1090" y="545" width="310" height="90" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="1115" y="581">Elasticsearch</text>
  <text class="small" x="1115" y="608">Index lu par le search service</text>
  <path class="line" d="M1172 435V545" stroke="#64748b" marker-end="url(#arrow-blue)"/>

  <rect class="card" x="1090" y="690" width="310" height="80" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="1115" y="725">PostgreSQL</text>
  <text class="small" x="1115" y="750">Base keycloak</text>

  <!-- Event broker and consumers -->
  <rect class="card" x="565" y="695" width="390" height="92" fill="#fffbeb" stroke="#fbbf24"/>
  <text class="label" x="590" y="733">Kafka</text>
  <text class="small" x="590" y="760">job-offer.events · application.events</text>

  <path class="line" d="M522 635V665H680V685" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path class="line" d="M847 635V665H820V685" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <rect x="574" y="648" width="90" height="23" rx="11" fill="#fef3c7"/>
  <text class="pill" x="590" y="664" fill="#b45309">Outbox</text>
  <rect x="826" y="648" width="90" height="23" rx="11" fill="#fef3c7"/>
  <text class="pill" x="842" y="664" fill="#b45309">Outbox</text>

  <rect class="card" x="260" y="850" width="330" height="100" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="label" x="284" y="889">Job offer indexer</text>
  <text class="small" x="284" y="916">Consomme job-offer.events</text>
  <path class="line" d="M650 787V820H425V840" stroke="#d97706" marker-end="url(#arrow-amber)"/>

  <rect class="card" x="700" y="850" width="330" height="100" fill="#f0fdf4" stroke="#4ade80"/>
  <text class="label" x="724" y="889">Notification service</text>
  <text class="small" x="724" y="916">Consomme application.events</text>
  <path class="line" d="M870 787V840" stroke="#d97706" marker-end="url(#arrow-amber)"/>

  <path class="line" d="M590 900H1060V620H1080" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <rect x="957" y="771" width="100" height="24" rx="12" fill="#ede9fe"/>
  <text class="pill" x="972" y="788" fill="#6d28d9">Indexation</text>

  <rect class="card" x="1120" y="850" width="280" height="100" fill="#ecfdf5" stroke="#34d399"/>
  <text class="label" x="1144" y="889">Serveur SMTP</text>
  <text class="small" x="1144" y="916">Envoi des e-mails</text>
  <path class="line" d="M1030 900H1110" stroke="#059669" marker-end="url(#arrow-green)"/>

  <!-- Keycloak persistence -->
  <path class="line" d="M775 160H1450V730H1410" stroke="#64748b" marker-end="url(#arrow-blue)"/>

  <!-- Legend -->
  <g transform="translate(60 989)">
    <circle cx="6" cy="0" r="5" fill="#2563eb"/><text class="tiny" x="18" y="4">API / routage</text>
    <circle cx="135" cy="0" r="5" fill="#0891b2"/><text class="tiny" x="147" y="4">HTTP interservices</text>
    <circle cx="325" cy="0" r="5" fill="#d97706"/><text class="tiny" x="337" y="4">Événements Kafka</text>
    <circle cx="515" cy="0" r="5" fill="#7c3aed"/><text class="tiny" x="527" y="4">Identité / indexation</text>
    <circle cx="735" cy="0" r="5" fill="#64748b"/><text class="tiny" x="747" y="4">Persistance</text>
    <circle cx="870" cy="0" r="5" fill="#059669"/><text class="tiny" x="882" y="4">E-mail</text>
  </g>
</svg>
